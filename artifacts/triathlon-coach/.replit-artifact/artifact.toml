kind = "web"
previewPath = "/"
title = "Triathlon Coach"
description = "A responsive personal adaptive triathlon training app for tracking planned sessions, training context, athlete feedback, goal progress, and explainable workout recommendations."
version = "1.0.0"
id = "artifacts/triathlon-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20142

[services.development]
run = "pnpm --filter @workspace/triathlon-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triathlon-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/triathlon-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20142"
BASE_PATH = "/"
